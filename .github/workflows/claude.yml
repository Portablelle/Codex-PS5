name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Queue @claude requests on the same issue/PR so two runs never push to one branch
# at once. Events without a mention get their own group, so they can't displace a
# queued request.
concurrency:
  group: ${{ contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') && format('claude-{0}', github.event.issue.number || github.event.pull_request.number) || format('claude-skip-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: compare with the base and check tests against pre-fix code
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          # Full Bash so Claude can build, run the tests and use git (private repo,
          # only users with write access can trigger this workflow).
          claude_args: >-
            --model claude-sonnet-5-5 --effort high
            --allowedTools "Bash"
            --append-system-prompt "Follow CLAUDE.md. Before pushing code, run bash tools/test.sh and fix any failure. When you fix a bug, add a regression test and prove it: run it against the pre-fix code (git checkout <base> -- <files>), confirm it fails, then restore the fix and confirm it passes. When asked to fix review findings (IDs R1, R2, ... from the Claude review summary), address each one, or explain why you did not. End your reply with the exact commands you ran and their results, and what you could not verify (PS5 build, console). Reply in the language of the request; write code, commits and docs in English."
