name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The code-review plugin spawns a background sub-agent and then ends the
          # session before it answers (no review is ever posted in headless mode),
          # so we use a direct prompt instead.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness. Do the work yourself, do not
            spawn sub-agents and do not wait for background tasks.

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` and, when needed,
               `gh pr view ${{ github.event.pull_request.number }}` to understand the change.
               Read surrounding files in the checkout when the diff alone is not enough.
            2. Look for real problems only: bugs, crashes, wrong logic, security issues,
               missing error handling, race conditions, broken edge cases. Skip style
               nitpicks and anything a linter would catch. Only report issues you are
               confident about.
            3. For each issue, post an inline comment on the exact line with
               mcp__github_inline_comment__create_inline_comment (explain the problem and
               suggest a fix).
            4. Finish with ONE summary comment using `gh pr comment ${{ github.event.pull_request.number }} --body "..."`.
               If you found nothing, say so briefly ("No blocking issues found.").
            Write all comments in French.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"'
          # Temporary: keep full output until reviews are confirmed working
          show_full_output: true
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

