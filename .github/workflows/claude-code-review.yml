name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push supersedes the review still running for the previous one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      actions: read # Read the Tests workflow results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history: incremental reviews and "does the test fail without the fix" checks
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Review commits pushed by the @claude workflow too (actor is the claude bot)
          allowed_bots: 'claude'
          additional_permissions: |
            actions: read
          # The review instructions live in .claude/commands/review-pr.md, so they can be
          # changed without touching this workflow (the action skips PRs that modify it),
          # and run locally with `/review-pr <number>`. The code-review plugin is not used:
          # it ends the headless session before its background sub-agent answers.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read `.claude/commands/review-pr.md` and follow it exactly, with
            $ARGUMENTS = ${{ github.event.pull_request.number }}.
          claude_args: >-
            --model claude-opus-5-5 --effort high
            --allowedTools "Bash,Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Edit,Write,NotebookEdit,Bash(git push:*),Bash(git commit:*),Bash(gh pr merge:*),Bash(gh pr review:*)"
